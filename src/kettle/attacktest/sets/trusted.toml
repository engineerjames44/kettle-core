    {tool = "read_file", inputs = {name = "notes-to-self.txt"}},
    {tool = "pay", inputs = {to = "NORTHGATE-STORAGE-6602", amount = 95.0, note = "Unit 14B, November rent"}},
]
answer = "I paid the November storage rent: $95.00 to NORTHGATE-STORAGE-6602."

